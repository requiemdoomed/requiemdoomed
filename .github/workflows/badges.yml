name: Update project badges

on:
  schedule:
    - cron: "17 * * * *"   # every hour
  workflow_dispatch:         # run it by hand from the Actions tab
  push:
    branches: [main]
    paths:
      - README.md            # new or renamed projects get badges right away
      - .github/scripts/update_badges.py

permissions:
  contents: write

concurrency:
  group: badges
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Build badges from the GitHub API
        run: python3 .github/scripts/update_badges.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changed badges
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add badges
          if git diff --cached --quiet; then
            echo "Badges already up to date."
          else
            git commit -m "Update project badges"
            git push
          fi
